name: Build Seaurchin Bench Container

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-bench:
    if: github.repository_owner == 'seahorn'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free disk space on runner
        # ubuntu-latest ships ~14 GB free; the bench image is ~8 GB plus
        # build cache. Drop preinstalled toolchains we don't need.
        run: |
          sudo rm -rf /usr/share/dotnet \
                      /usr/local/lib/android \
                      /opt/ghc \
                      /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost
          docker system prune -af
          df -h /

      - name: Checkout seaurchin-bench
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push bench image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/seaurchin-bench.dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/seahorn/seaurchin-bench:latest
          # RUN_ID busts the cache for the reframe RUN step so each CI run
          # actually re-executes the benchmark check rather than reusing
          # a stale cached result.
          build-args: |
            RUN_ID=${{ github.sha }}
